# Simplified release workflow for fork repositories.
# Uses standard free GitHub runners (ubuntu-latest, windows-latest).
# Only builds Linux x86_64 and Windows x64.
# Removes GCS, Sentry, Slack, code signing, changelog generation.

name: Create Release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (dev, preview, stable)
        type: string
        required: true
        default: dev
      build_linux:
        description: Build Linux artifacts
        type: boolean
        default: true
      build_windows:
        description: Build Windows artifacts
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create version tag
        id: create_tag
        run: |
          TIMESTAMP=$(date +%Y.%m.%d.%H.%M)
          TAG="v0.${TIMESTAMP}.${{ inputs.channel }}_00"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"
        shell: bash

      - name: Create GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: Warp ${{ inputs.channel }} ${{ steps.create_tag.outputs.tag }}
          tag_name: ${{ steps.create_tag.outputs.tag }}
          body: |
            Warp ${{ inputs.channel }} build from fork.
            - Linux x86_64 (AppImage, deb)
            - Windows x64 (exe installer)
          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

  release_linux_x86:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    needs: prepare_release
    if: ${{ inputs.build_linux != false }}
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: ./script/linux/install_build_deps
        shell: bash

      - name: Install linuxdeploy
        run: |
          script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install cargo-about
        run: cargo install cargo-about@0.8.4
        shell: bash

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Bundle app (AppImage + deb)
        id: bundle_app
        run: |
          script/bundle --channel $CHANNEL --packages appimage,deb
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: ${{ steps.bundle_app.outputs.packages_dir }}/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-x86_64-${{ inputs.channel }}
          path: ${{ steps.bundle_app.outputs.packages_dir }}

  release_windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: prepare_release
    if: ${{ inputs.build_windows != false }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable long paths
        run: git config --system core.longpaths true
        shell: bash

      - name: Install protoc
        run: |
          $protoDir = "$env:LOCALAPPDATA\protoc"
          if (!(Test-Path "$protoDir\bin\protoc.exe")) {
            New-Item -ItemType Directory -Force -Path "$protoDir" | Out-Null
            $url = "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-win64.zip"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\protoc.zip"
            Expand-Archive -Path "$env:TEMP\protoc.zip" -DestinationPath "$protoDir" -Force
          }
          echo "$protoDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install cargo-about
        run: cargo install cargo-about@0.8.4
        shell: bash

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build binary
        id: build_binary
        run: script/bundle -Channel $CHANNEL -skip_build_installer --arch x64
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}

      - name: Bundle app
        id: bundle_app
        run: script/bundle -Channel $CHANNEL -skip_build_binary --arch x64
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: ${{ steps.bundle_app.outputs.installer_path }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-windows-x64-${{ inputs.channel }}
          path: ${{ steps.bundle_app.outputs.installer_path }}
